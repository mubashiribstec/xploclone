# XploClone — Phase 1 compose file.
# api: FastAPI + Chatterbox Turbo, needs an NVIDIA GPU (≥12 GB VRAM,
# dedicated to TTS). web: Next.js admin UI, talks to the API server-side.
# Recordings are NOT in this repo: mount them read-only from the host
# (private encrypted store) at /app/api/reference.
#
# Security (M1): both services bind to 127.0.0.1 on the host by default —
# localhost / VPN only. Do NOT expose web:3000 publicly as-is: the web UI
# is a single-owner admin UI behind a login, and it must sit behind a
# reverse proxy with TLS (or a VPN) before any public exposure.
# The API is reachable only via the web container's internal network
# plus localhost for local curl checks.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: xploclone-api:0.1.0
    # .env is optional (m13): compose must not fail without it. Copy
    # .env.example to .env and generate real keys first (see README).
    env_file:
      - path: .env
        required: false
    environment:
      XPLOCLONE_REF_DIR: /app/api/reference
    volumes:
      # Host path for reference clips — set in .env or edit here.
      # Leave commented out until recordings exist; the API then reports
      # voices as "unavailable" (correct behaviour, not a bug).
      # - ${XPLOCLONE_REF_HOST_DIR:-./api/reference}:/app/api/reference:ro
      - ./api/reference:/app/api/reference:ro
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start-period: 120s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: xploclone-web:0.1.0
    # Only the variables this service needs (m13) — no env_file, so the
    # web container never receives the API hash or engine settings.
    environment:
      XPLOCLONE_API_URL: http://api:8000
      XPLOCLONE_API_KEY: ${XPLOCLONE_API_KEY:-}
      XPLOCLONE_WEB_PASSWORD_HASH: ${XPLOCLONE_WEB_PASSWORD_HASH:-}
      XPLOCLONE_WEB_SESSION_SECRET: ${XPLOCLONE_WEB_SESSION_SECRET:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
